# Rotate /var/log/torrentino.log.
#
# torrentino.service writes through systemd:
#   StandardOutput=append:/var/log/torrentino.log
# so the process keeps the file descriptor open and cannot be asked to reopen
# the file. copytruncate copies the current content and truncates the same
# inode, which keeps that descriptor usable. Do not replace it with create +
# postrotate restart: the service would briefly stop and restart the bot.
/var/log/torrentino.log {
    daily
    rotate 14
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
}
