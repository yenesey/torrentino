# Torrentino web interface behind nginx.
# Main deployment: https://torrentino.example.com/ (base-path "/").
# HTTP is used only for ACME; everything else is redirected to HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name torrentino.example.com;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name torrentino.example.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/torrentino.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/torrentino.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 128k;
    access_log /var/log/nginx/torrentino.access.log;
    error_log  /var/log/nginx/torrentino.error.log;

    location / {
        proxy_pass         http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_redirect     off;
        proxy_connect_timeout 5s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
    }
}
